apisixConfig:
  routes:
    selfHostedQwenCompletion:
      type: completion
      provider: selfHosted
      providerFormat: openai-compatible
      vllmConfigId: completionQwen
      models:
        - name: Qwen/Qwen2.5-0.5B-Instruct
    selfHostedQwenEmbedding:
      type: embedding
      provider: selfHosted
      providerFormat: openai-compatible
      vllmConfigId: embeddingQwen
      models:
        - name: Qwen/Qwen3-Embedding-0.6B

apisix:
  metrics:
    serviceMonitor:
      enabled: true
  ingress:
    enabled: true
    hosts:
      - host: llm-stack.localhost
        paths:
          - /v1/chat/completions
          - /v1/embeddings
          - /v1/models

vllmConfigs:
  completionQwen:
    image:
      name: "vllm/vllm-openai-cpu"
      tag: "v0.33.0"
      pullPolicy: "IfNotPresent"
    replicaCount: 1
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    service:
      type: ClusterIP
      port: 8000
      annotations: {}
    model: Qwen/Qwen2.5-0.5B-Instruct
    extraArgs:
      - "--gpu-memory-utilization"
      - "0.25"
      - "--dtype"
      - "float32"
      - "--max-model-len"
      - "1024"
      - "--max-num-seqs"
      - "4"
    # Environment variables (e.g., HF_TOKEN for private models, huggingface hub configurations)
    env:
      - name: OMP_NUM_THREADS
        value: "2"
      - name: VLLM_CPU_KVCACHE_SPACE
        value: "1"
    # Resources request/limit including GPUs
    resources:
      limits:
        cpu: "2"
        memory: "8Gi"
        nvidia.com/gpu: null
      requests:
        cpu: "2"
        memory: "8Gi"
        nvidia.com/gpu: null
    # Persistence settings to cache HuggingFace/Model files locally
    persistence:
      enabled: false
      hostPath: {}
      #  path: /mnt/nvme/vllm-cache
      existingClaim: {}
      #  name: existingClaimName
      persistentVolumeClaim: {}
      #  storageClass: "sbs-default"
      #  size: "100Gi"
      #  accessModes:
      #    - ReadWriteOnce
    # Node scheduling and placement configs
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podAnnotations: {}
    podLabels: {}
    startupProbe:
      enabled: true
    livenessProbe:
      enabled: true
    readinessProbe:
      enabled: true
    sharedMemorySize: "2Gi"
    extraVolumes: {}
    extraVolumeMounts: {}
  embeddingQwen:
    image:
      name: "vllm/vllm-openai-cpu"
      tag: "v0.33.0"
      pullPolicy: "IfNotPresent"
    replicaCount: 1
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    service:
      type: ClusterIP
      port: 8000
      annotations: { }
    model: Qwen/Qwen3-Embedding-0.6B
    extraArgs:
      - "--runner"
      - "pooling"
      - "--gpu-memory-utilization"
      - "0.25"
      - "--dtype"
      - "float32"
      - "--max-model-len"
      - "1024"
      - "--max-num-seqs"
      - "4"
      - "--hf-overrides"
      - '{"is_matryoshka": true}'
    # Environment variables (e.g., HF_TOKEN for private models, huggingface hub configurations)
    env:
      - name: OMP_NUM_THREADS
        value: "1"
      - name: VLLM_CPU_KVCACHE_SPACE
        value: "1"
    # - name: HF_TOKEN
    #   value: "your_huggingface_token_here"
    # Resources request/limit including GPUs
    resources:
      limits:
        cpu: "1"
        memory: "8Gi"
        nvidia.com/gpu: null
      requests:
        cpu: "1"
        memory: "8Gi"
        nvidia.com/gpu: null
    # Persistence settings to cache HuggingFace/Model files locally
    persistence:
      enabled: false
      hostPath: {}
      #  path: /mnt/nvme/vllm-cache
      existingClaim: {}
      #  name: existingClaimName
      persistentVolumeClaim: {}
      #  storageClass: "sbs-default"
      #  size: "100Gi"
      #  accessModes:
      #    - ReadWriteOnce
    # Node scheduling and placement configs
    nodeSelector: { }
    tolerations: [ ]
    affinity: { }
    podAnnotations: { }
    podLabels: { }
    startupProbe:
      enabled: true
    livenessProbe:
      enabled: true
    readinessProbe:
      enabled: true
    sharedMemorySize: "2Gi"
    extraVolumes: {}
    extraVolumeMounts: {}

devMonitoring:
  enabled: true
