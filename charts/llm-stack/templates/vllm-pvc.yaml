{{- range $id, $config := .Values.vllmConfigs }}
{{- if and $config.persistence.enabled (not $config.persistence.hostPath) (not $config.persistence.existingClaim) $config.persistence.persistentStorageClaim }}
{{- $claim := $config.persistence.persistentStorageClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "common.names.fullname" $ }}-vllm-{{ $id | kebabcase | lower }}-cache
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" (dict "customLabels" $.Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: vllm-{{ $id | kebabcase | lower }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml $claim.accessModes | nindent 4 }}
  {{- if $claim.storageClass }}
  storageClassName: {{ $claim.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $claim.size | quote }}
---
{{- end }}
{{- end }}
