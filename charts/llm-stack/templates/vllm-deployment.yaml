{{- range $id, $config := .Values.vllmConfigs }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" $ }}-vllm-{{ $id | kebabcase | lower}}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" (dict "customLabels" $.Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: vllm-{{ $id | kebabcase | lower }}
spec:
  replicas: {{ $config.replicaCount | default 1 }}
  strategy:
    {{- toYaml $config.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" (dict "customLabels" $.Values.commonLabels "context" $) | nindent 6 }}
      app.kubernetes.io/component: vllm-{{ $id | kebabcase | lower }}
  template:
    metadata:
      labels:
        {{- include "common.labels.standard" (dict "customLabels" $.Values.commonLabels "context" $) | nindent 8 }}
        app.kubernetes.io/component: vllm-{{ $id | kebabcase | lower }}
        {{- with $config.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $config.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if $config.schedulerName }}
      schedulerName: {{ $config.schedulerName | quote }}
      {{- end }}
      containers:
        - name: vllm-{{ $id | kebabcase | lower }}
          image: "{{ $config.image.name }}:{{ $config.image.tag }}"
          imagePullPolicy: {{ $config.image.pullPolicy }}
          args:
            - {{ $config.model }}
            - "--enable-prompt-tokens-details"
            {{- if $config.extraArgs }}
            {{- toYaml $config.extraArgs | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- if $config.env }}
            {{- toYaml $config.env | nindent 12 }}
            {{- end }}
          {{- if $config.resources }}
          resources:
            {{- toYaml $config.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: cache
              mountPath: {{ $config.persistence.mountPath | default "/root/.cache" }}
            {{- if $config.extraVolumeMounts }}
            {{- toYaml $config.extraVolumeMounts | nindent 12 }}
            {{- end }}
          {{- if $config.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ $config.startupProbe.path | default "/health" }}
              port: http
            periodSeconds: {{ $config.startupProbe.periodSeconds | default 2 }}
            failureThreshold: {{ $config.startupProbe.failureThreshold | default 480 }}
          {{- end }}
          {{- if $config.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ $config.livenessProbe.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ $config.livenessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ $config.livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ $config.livenessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ $config.livenessProbe.failureThreshold | default 3 }}
          {{- end }}
          {{- if $config.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ $config.readinessProbe.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ $config.readinessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ $config.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ $config.readinessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ $config.readinessProbe.failureThreshold | default 3 }}
          {{- end }}
      {{- with $config.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $config.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $config.sharedMemorySize | default "4Gi" }}
        - name: cache
          {{- if and $config.persistence.enabled (not $config.persistence.hostPath) }}
          persistentVolumeClaim:
            claimName: {{ if $config.persistence.existingClaim }}{{ $config.persistence.existingClaim.name }}{{ else }}{{ include "common.names.fullname" $ }}-vllm-{{ $id | kebabcase | lower}}-cache{{ end }}
          {{- else if and $config.persistence.enabled $config.persistence.hostPath }}
          hostPath:
            path: {{ $config.persistence.hostPath.path }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if $config.extraVolumes }}
        {{- toYaml $config.extraVolumes | nindent 8 }}
        {{- end }}
---
{{- end }}
