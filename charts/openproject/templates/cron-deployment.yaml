---
apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}-cron
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    openproject/process: cron
    app.kubernetes.io/component: cron
  {{- if or .Values.cron.annotations .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" ( dict "values" ( list .Values.cron.annotations .Values.commonAnnotations ) "context" . ) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ if .Values.cron.enabled }}{{- 1 }}{{ else }}{{- 0 }}{{ end }}
  strategy:
    type: "Recreate"
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
      openproject/process: cron
  template:
    metadata:
      annotations:
        {{- range $key, $val := .Values.podAnnotations }}
        {{ $key }}: {{ $val | quote }}
        {{- end }}
        {{- include "openproject.envChecksums" . | nindent 8 }}
        checksum/env-cron-environment: {{ include (print $.Template.BasePath "/secret_cron_environment.yaml") $ | sha256sum }}
      labels:
        {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 8 }}
        openproject/process: cron
        app.kubernetes.io/component: cron
    spec:
      {{- include "openproject.imagePullSecrets" . | indent 6 }}
      {{- with .Values.affinity }}
      affinity:
        {{ toYaml . | nindent 8 | trim }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{ toYaml . | nindent 8 | trim }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 | trim }}
      {{- end }}
      {{- include "openproject.podSecurityContext" . | indent 6 }}
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName | quote }}
      {{- end }}
      serviceAccountName: {{ include "common.names.fullname" . }}
      volumes:
        {{- include "openproject.tmpVolumeSpec" . | indent 8 }}
        {{- if .Values.egress.tls.rootCA.fileName }}
        - name: ca-pemstore
          configMap:
            name: "{{- .Values.egress.tls.rootCA.configMap }}"
        {{- end }}
        {{- if and .Values.persistence.enabled (not .Values.s3.enabled) (not .Values.rustfs.bundled) }}
        - name: "data"
          persistentVolumeClaim:
            claimName: {{ if .Values.persistence.existingClaim }}{{ .Values.persistence.existingClaim }}{{- else }}{{ include "common.names.fullname" . }}{{- end }}
        {{- end }}
        {{- include "openproject.extraVolumes" . | indent 8 }}
      initContainers:
        {{- include "openproject.tmpVolumeInitContainer" . | indent 8 }}
        - name: wait-for-db
          {{- include "openproject.containerSecurityContext" . | indent 10 }}
          image: {{ include "openproject.image" . }}
          imagePullPolicy: {{ .Values.image.imagePullPolicy }}
          envFrom:
            {{- include "openproject.envFrom" . | nindent 12 }}
            - secretRef:
                name: {{ include "common.names.fullname" . }}-cron-environment
          env:
            {{- include "openproject.env" . | nindent 12 }}
          args:
            - bash
            - /app/docker/prod/wait-for-db
          {{- if .Values.appInit.resources }}
          resources:
            {{- toYaml .Values.appInit.resources | nindent 12 }}
          {{- else if ne .Values.appInit.resourcesPreset "none" }}
          resources:
            {{- include "common.resources.preset" (dict "type" .Values.appInit.resourcesPreset) | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "openproject.tmpVolumeMounts" . | indent 12 }}
      containers:
        - name: "cron"
          {{- include "openproject.containerSecurityContext" . | indent 10 }}
          image: {{ include "openproject.image" . }}
          imagePullPolicy: {{ .Values.image.imagePullPolicy }}
          envFrom:
            {{- include "openproject.envFrom" . | nindent 12 }}
            - secretRef:
                name: {{ include "common.names.fullname" . }}-cron-environment
          args:
            - bash
            - /app/docker/prod/cron
          env:
            {{- include "openproject.env" . | nindent 12 }}
          volumeMounts:
            {{- include "openproject.tmpVolumeMounts" . | indent 12 }}
            {{- if and .Values.persistence.enabled (not .Values.s3.enabled) (not .Values.rustfs.bundled) }}
            - name: "data"
              mountPath: "/var/openproject/assets"
            {{- end }}
            {{- if .Values.egress.tls.rootCA.fileName }}
            - name: ca-pemstore
              mountPath: /etc/ssl/certs/custom-ca.pem
              subPath: {{ .Values.egress.tls.rootCA.fileName }}
              readOnly: false
            {{- end }}
            {{- include "openproject.extraVolumeMounts" . | indent 12 }}
          {{- $liveness := include "openproject.mergedProbe" (dict "probe" .Values.probes.liveness "overrides" .Values.cron.probes.liveness) | fromYaml }}
          {{- $readiness := include "openproject.mergedProbe" (dict "probe" .Values.probes.readiness "overrides" .Values.cron.probes.readiness) | fromYaml }}
          {{- if and $liveness.enabled .Values.cron.probes.enabled }}
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - kill -0 1
          {{- include "openproject.probeSettings" $liveness | nindent 12 }}
          {{- end }}
          {{- if and $readiness.enabled .Values.cron.probes.enabled }}
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - kill -0 1
          {{- include "openproject.probeSettings" $readiness | nindent 12 }}
          {{- end }}
          {{- if (coalesce .Values.cron.resources .Values.resources) }}
          resources:
            {{- coalesce .Values.cron.resources .Values.resources | toYaml | nindent 12 }}
          {{- else if ne (coalesce .Values.cron.resourcesPreset .Values.resourcesPreset) "none" }}
          resources:
            {{- include "common.resources.preset" (dict "type" (coalesce .Values.cron.resourcesPreset .Values.resourcesPreset)) | nindent 12 }}
          {{- end }}
