# Only generate this secret if
#   a) rustfs is bundled
# and if
#   b) the user has not pointed rustfs.secret.existingSecret at their own secret
# and if
#   c) this auto-generated secret does not exist yet.
{{-
  if and
    .Values.rustfs.bundled
    (eq .Values.rustfs.secret.existingSecret "rustfs-credentials-auto-generated")
    (not (lookup "v1" "Secret" .Release.Namespace "rustfs-credentials-auto-generated"))
}}
---
apiVersion: v1
kind: Secret
metadata:
  name: rustfs-credentials-auto-generated
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: rustfs
  annotations:
    # This annotation together with the lookup above ensures the credentials are not
    # regenerated on each upgrade — only created once and then kept.
    "helm.sh/resource-policy": "keep"
    {{- if .Values.commonAnnotations }}
      {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
    {{- end }}
data: # reset data to make sure only keys defined below remain
stringData:
  {{- $accessKey := randAlphaNum 20 }}
  {{- $secretKey := randAlphaNum 40 }}
  OPENPROJECT_FOG_CREDENTIALS_AWS__ACCESS__KEY__ID: {{ $accessKey | quote }}
  OPENPROJECT_FOG_CREDENTIALS_AWS__SECRET__ACCESS__KEY: {{ $secretKey | quote }}
...
{{- end }}
