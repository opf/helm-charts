{{- if include "openproject.assetServer.enabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openproject.assetServer.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  Caddyfile: |
    {
        admin off
        auto_https off
        persist_config off
    }

    :8080 {
        handle_path {{ .Values.openproject.railsRelativeUrlRoot | default "" }}/assets/* {
            @asset file {
                root /srv/assets
            }

            handle @asset {
                root * /srv/assets
                @fingerprinted path_regexp -([0-9a-f]{64}|[A-Z0-9]{8})\.[^/]+$
                @unfingerprinted not path_regexp -([0-9a-f]{64}|[A-Z0-9]{8})\.[^/]+$
                header @fingerprinted Cache-Control "public, max-age=31536000, immutable"
                header @unfingerprinted Cache-Control "no-cache"
                {{- if .Values.assetServer.encode }}
                encode zstd gzip
                {{- end }}
                file_server {
                    precompressed br gzip
                }
            }

            handle {
                rewrite * {http.request.orig_uri}
                reverse_proxy {{ include "common.names.fullname" . }}:{{ .Values.service.ports.http.port }} {
                    header_up X-Forwarded-Proto {header.X-Forwarded-Proto}
                    header_up X-Forwarded-For {header.X-Forwarded-For}
                }
            }
        }

        handle {
            respond 404
        }
    }
{{- end }}
