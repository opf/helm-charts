# Only generate this secret if
#   a) the included AnyCable deployment is enabled
#   b) no existing secret is configured for the openproject live updates
#   c) no existing secret is configured for the included AnyCable deployment
# and if
#   d) this automatically generated secret does not exist yet.
{{-
  if and
    .Values.anycable.enabled
    (not (
      or
        .Values.openproject.live_updates.auth.existingSecret
        .Values.anycable.auth.existingSecret
        (lookup "v1" "Secret" .Release.Namespace "anycable-secret-auto-generated")
    ))
}}
---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: anycable-secret-auto-generated
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: anycable
  annotations:
    # This annotation together with the lookup of the existing secret above ensures that this secret is not
    # regenerated during each upgrade, but kept the same.
    "helm.sh/resource-policy": "keep"
    {{- if .Values.commonAnnotations }}
      {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
    {{- end }}
data: # reset data to make sure only keys defined below remain
stringData:
  secret: {{ randAlphaNum 32 | quote }}
...
{{- end }}
