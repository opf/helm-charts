{{- $name := include "openproject.postgresql.secretName" . }}
{{- if and .Values.postgresql.bundled (not .Values.postgresql.auth.existingSecret) (not (lookup "v1" "Secret" .Release.Namespace $name)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    helm.sh/resource-policy: keep
type: Opaque
data: # reset data to make sure only keys defined below remain
stringData:
  {{ .Values.postgresql.auth.secretKeys.adminPasswordKey }}: {{ default (randAlphaNum 32) .Values.postgresql.auth.postgresPassword | quote }}
  {{ .Values.postgresql.auth.secretKeys.userPasswordKey }}: {{ default (randAlphaNum 32) .Values.postgresql.auth.password | quote }}
{{- end }}
