name: Backup integration test

on:
  pull_request:
    paths:
      - 'charts/openproject/templates/backup-*'
      - 'charts/openproject/templates/secret_backup*'
      - 'charts/openproject/templates/_helpers.tpl'
      - 'charts/openproject/values.yaml'
      - 'spec/charts/openproject/integration/**'
      - 'spec/integration_helper.rb'
      - '.github/workflows/backup-integration.yml'
  workflow_dispatch:

jobs:
  backup-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attachments: [local, s3, s3-csi]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build chart dependencies
        run: helm dependency build charts/openproject

      - name: Run backup integration spec
        env:
          ATTACHMENTS: ${{ matrix.attachments }}
        run: bundle exec rspec --tag integration spec/charts/openproject/integration/backup_spec.rb
