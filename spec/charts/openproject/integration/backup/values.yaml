# Chart values for the backup integration spec (backup_spec.rb).
# The S3 services referenced here are deployed by the spec into the same namespace.

persistence:
  accessModes:
    - "ReadWriteOnce" # single-node test cluster

openproject:
  useTmpVolumes: false
containerSecurityContext:
  readOnlyRootFilesystem: false

environment:
  OPENPROJECT_HTTPS: false

cleanup:
  deletePodsOnSuccess: false # keep job pods around so their logs can be inspected

backup:
  enabled: true

  s3:
    endpoint: "http://backup-s3:9000"
    region: "us-east-1"
    bucket: "openproject-backup"
    auth:
      accessKeyId: "backup-s3-access"
      secretAccessKey: "backup-s3-secret-key"

  replica:
    enabled: true
    suspend: true # triggered manually by the test
    monitorHeartbeatUrl: "http://heartbeat:8080/replica"
    s3:
      endpoint: "http://replica-s3:9000"
      region: "us-east-1"
      bucket: "openproject-backup-replica"
      auth:
        accessKeyId: "replica-s3-access"
        secretAccessKey: "replica-s3-secret-key"

  # Never let the schedule fire during the test; jobs are created from the CronJobs explicitly.
  schedule: "0 0 31 2 *"

  # The heartbeat monitor deployed by the spec, which logs the requests it receives.
  monitorHeartbeatUrl: "http://heartbeat:8080/backup"
  verification:
    monitorHeartbeatUrl: "http://heartbeat:8080/verification"

  cache:
    persistent: false

  resources:
    limits:
      memory: "1Gi"
    requests:
      memory: "100Mi"

  image:
    imagePullPolicy: "IfNotPresent"
